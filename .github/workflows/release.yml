name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test filter and ring buffer
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          build-tests/test_core

      - name: Test detent logic
        run: |
          mkdir build-detent
          cp tests/detent_test.swift build-detent/main.swift
          swiftc -o build-detent/detent_test build-detent/main.swift macos/Sources/NSKit/DetentDrag.swift
          build-detent/detent_test

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_IDENTITY: Noise Sharpening Release Signing
        run: |
          build() {
            name="$1"; archs="$2"
            ARCHS="$archs" APP="$RUNNER_TEMP/$name/NoiseSharpening.app" VERSION="${VERSION#v}" macos/build-app.sh
            ditto -c -k --keepParent "$RUNNER_TEMP/$name/NoiseSharpening.app" "NoiseSharpening-${VERSION}-${name}.zip"
          }
          build universal "arm64 x86_64"
          build apple-silicon arm64
          build intel x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NoiseSharpening-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
